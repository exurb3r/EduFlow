name: Auto Release and Docker Build

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop, main]

permissions:
  contents: read
  actions: read

concurrency:
  group: eduflow-preview-release
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - name: Validate CI provenance
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.conclusion !== 'success' || run.event !== 'push' ||
                run.head_repository.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                !['main', 'develop'].includes(run.head_branch)) {
              throw new Error('Only successful same-repository push CI may publish a preview.');
            }
            const workflow = await github.rest.actions.getWorkflow({
              ...context.repo, workflow_id: run.workflow_id,
            });
            if (workflow.data.path !== '.github/workflows/ci.yml') {
              throw new Error('Release requires the trusted CI workflow.');
            }
            const branch = await github.rest.repos.getBranch({
              ...context.repo, branch: run.head_branch,
            });
            if (branch.data.commit.sha !== run.head_sha) {
              throw new Error('Refusing an obsolete CI run for a newer branch head.');
            }

      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Resolve preview identity
        id: identity
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python3 - <<'PY'
          import os
          version = '0.0.0-preview.' + os.environ['CI_RUN_ID']
          image = 'ghcr.io/' + os.environ['GITHUB_REPOSITORY'].lower()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
              output.write('tag=v' + version + '\n')
              output.write('image=' + image + '\n')
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tested preview image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.identity.outputs.image }}:${{ steps.identity.outputs.version }}
            ${{ steps.identity.outputs.image }}:sha-${{ github.event.workflow_run.head_sha }}
            ${{ steps.identity.outputs.image }}:preview
          labels: |
            org.opencontainers.image.title=EduFlow
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=${{ steps.identity.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: Write preview release metadata
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          TESTED_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_URL: ${{ github.event.workflow_run.html_url }}
          VERSION: ${{ steps.identity.outputs.version }}
          IMAGE: ${{ steps.identity.outputs.image }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          metadata = {
              'version': os.environ['VERSION'],
              'commit': os.environ['TESTED_SHA'],
              'branch': os.environ['TESTED_BRANCH'],
              'image': os.environ['IMAGE'] + ':' + os.environ['VERSION'],
              'ci_url': os.environ['CI_URL'],
              'release_type': 'preview',
          }
          Path('version.json').write_text(json.dumps(metadata, indent=2) + '\n')
          Path('RELEASE_NOTES.md').write_text(
              '# EduFlow preview\n\n'
              'Development preview; not certified for school production or live funds.\n\n'
              'Tested commit: `' + os.environ['TESTED_SHA'] + '`\n\n'
              'CI evidence: ' + os.environ['CI_URL'] + '\n\n'
              'Image: `' + metadata['image'] + '`\n'
          )
          PY

      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.identity.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: EduFlow ${{ steps.identity.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: true
          make_latest: false
          files: version.json
