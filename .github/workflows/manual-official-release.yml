name: Manual Official Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version, such as 1.0.0 or 1.0.0-preview.1'
        required: true
        type: string
      publish_latest:
        description: 'Update stable latest image (never for drafts or prereleases)'
        required: true
        default: false
        type: boolean
      draft:
        description: 'Create a draft release without updating stable aliases'
        required: true
        default: true
        type: boolean
      prerelease:
        description: 'Mark as preview; keep true until school release gates pass'
        required: true
        default: true
        type: boolean
      extra_notes:
        description: 'Release limitations and operator notes'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: eduflow-official-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
      commit: ${{ steps.validate.outputs.commit }}
      image: ${{ steps.validate.outputs.image }}
      publish_latest: ${{ steps.validate.outputs.publish_latest }}
      ci_url: ${{ steps.validate.outputs.ci_url }}
    steps:
      - name: Validate release inputs and exact-commit CI
        id: validate
        uses: actions/github-script@v7
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
          IS_DRAFT: ${{ inputs.draft }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        with:
          script: |
            if (context.ref !== 'refs/heads/main') {
              throw new Error('Official releases must originate from main.');
            }
            const version = process.env.INPUT_VERSION.replace(/^v/, '');
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:\.[0-9A-Za-z]+)*)?$/.test(version)) {
              throw new Error('Version must be a semantic version without build metadata.');
            }
            const prerelease = process.env.IS_PRERELEASE === 'true';
            const draft = process.env.IS_DRAFT === 'true';
            if (version.includes('-') && !prerelease) {
              throw new Error('A preview version must be marked as a prerelease.');
            }
            if (process.env.PUBLISH_LATEST === 'true' && (prerelease || draft)) {
              throw new Error('Drafts and prereleases cannot update stable latest.');
            }
            const branch = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            if (branch.data.commit.sha !== context.sha) {
              throw new Error('Main changed after dispatch; release the new tested commit instead.');
            }
            const runs = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'ci.yml',
              head_sha: context.sha,
              branch: 'main',
              event: 'push',
              per_page: 100,
            });
            const run = runs.data.workflow_runs.find((candidate) =>
              candidate.head_sha === context.sha && candidate.event === 'push' &&
              candidate.head_repository.full_name === `${context.repo.owner}/${context.repo.repo}`
            );
            if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
              throw new Error('Latest push CI for this exact commit must pass before release.');
            }
            const tag = `v${version}`;
            try {
              await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
              throw new Error('Release tag already exists; immutable versions cannot be overwritten.');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput('version', version);
            core.setOutput('tag', tag);
            core.setOutput('commit', context.sha);
            core.setOutput('image', `ghcr.io/${context.repo.owner}/${context.repo.repo}`.toLowerCase());
            core.setOutput('publish_latest', process.env.PUBLISH_LATEST);
            core.setOutput('ci_url', run.html_url);

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve versioned image tags
        id: tags
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISH_LATEST: ${{ needs.prepare.outputs.publish_latest }}
        run: |
          python3 - <<'PY'
          import json, os
          tags = [os.environ['IMAGE'] + ':' + os.environ['VERSION']]
          if os.environ['PUBLISH_LATEST'] == 'true':
              tags.append(os.environ['IMAGE'] + ':latest')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tags=' + ','.join(tags) + '\n')
          PY

      - name: Build tested release image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=EduFlow
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: Write release metadata
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TESTED_SHA: ${{ needs.prepare.outputs.commit }}
          CI_URL: ${{ needs.prepare.outputs.ci_url }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          EXTRA_NOTES: ${{ inputs.extra_notes }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          metadata = {
              'version': os.environ['VERSION'],
              'commit': os.environ['TESTED_SHA'],
              'image': os.environ['IMAGE'] + ':' + os.environ['VERSION'],
              'ci_url': os.environ['CI_URL'],
              'release_type': 'preview' if os.environ['IS_PRERELEASE'] == 'true' else 'official',
          }
          Path('version.json').write_text(json.dumps(metadata, indent=2) + '\n')
          Path('RELEASE_NOTES.md').write_text(
              '# EduFlow ' + os.environ['VERSION'] + '\n\n'
              'Tested commit: `' + os.environ['TESTED_SHA'] + '`\n\n'
              'CI evidence: ' + os.environ['CI_URL'] + '\n\n'
              'Image: `' + metadata['image'] + '`\n\n'
              + os.environ.get('EXTRA_NOTES', '') + '\n'
          )
          PY

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.commit }}
          name: EduFlow ${{ needs.prepare.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ !inputs.draft && !inputs.prerelease }}
          files: version.json
